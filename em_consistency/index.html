    --bg: #161616;
    --surface: #222222;
    --surface-alt: #2a2a2a;
    --text: #e8e8e8;

    --accent: #60a5fa;
    --accent-light: #1e3a5f;
    --border: #444;
    --green: #4ade80;
    --amber: #fbbf24;
    --red: #f87171;
  }
}
:root[data-theme="dark"] {
  --bg: #161616;
  --surface: #222222;
  --surface-alt: #2a2a2a;
  --text: #e8e8e8;
  --text-muted: #999;
  --accent: #60a5fa;
  --accent-light: #1e3a5f;
  --border: #444;
  --green: #4ade80;
  --amber: #fbbf24;
  --red: #f87171;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}
.container { max-width: 800px; margin: 0 auto; padding: 24px 16px; }
header { text-align: center; margin-bottom: 32px; }
header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.02em; }

.search-box {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 8px;
  padding: 16px;

<body>
<div class="container">
  <header>
    <h1>日本語読み一貫性データベース</h1>
    <p>EM アルゴリズムによる漢字読み分布と Consistency 指標</p>
  </header>

  <div class="corpus-tabs" id="corpusTabs"></div>

  <div class="search-box">
    <input type="text" id="queryInput" placeholder="漢字・単語・非単語を入力（例: 学校, 熱校）"
           autocomplete="off">

           autocomplete="off" style="max-width:220px">
    <button onclick="doSearch()">検索</button>
  </div>

  <div id="results">
    <div class="empty-state">
      <div class="icon">🔍</div>
      <p>語を入力すると consistency スコアと読み候補を表示します</p>
    </div>
  </div>

  <div class="info-footer">
    <p>Prototype — psycholing_metrics_ja v2.6 / EM alignment with confidence weighting</p>
    <p>コーパス切替で異なるデータベースの結果を比較できます</p>
  </div>

<script>
// ═══════════════════════════════════════════
// Data (prototype: embedded sample; production: load JSON)
// ═══════════════════════════════════════════

// コーパスデータを外部 JSON から読み込む
const CORPORA = {};

// 読み込むコーパスの一覧
const CORPUS_FILES = [
  { key: 'wlsp',  label: 'WLSP (分類語彙表)',     dir: 'data' },
  { key: 'nlt',   label: 'NLT (BCCWJ)',          dir: 'data' },
  { key: 'elem',  label: '小学校教科書',           dir: 'data' },
// { key: 'psylex71',   label: 'psylex71 (新聞)',      dir: 'data' },
];

/**
 * .json.gz を fetch し、ブラウザ内で解凍して JSON をパースする。
 * .gz が見つからなければ .json にフォールバック。
 */
async function fetchJSON(url) {
  // まず .gz を試す
  const gzUrl = url + '.gz';
  let res = await fetch(gzUrl);

  if (res.ok) {
    // DecompressionStream で gzip 解凍
    const ds = new DecompressionStream('gzip');
    const decompressed = res.body.pipeThrough(ds);
    const reader = decompressed.getReader();
    const chunks = [];
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
    }
    const blob = new Blob(chunks);
    const text = await blob.text();
    console.log(`  ✓ ${gzUrl} (${(Number(res.headers.get('content-length'))/1024).toFixed(0)} KB gz)`);
    return JSON.parse(text);
  }

  // .gz がなければ .json にフォールバック
  res = await fetch(url);
  if (!res.ok) return null;
  console.log(`  ✓ ${url}`);
  return res.json();
}

async function loadAllCorpora() {
  for (const { key, label, dir } of CORPUS_FILES) {
    try {
      console.log(`${key}: 読み込み中...`);
      const [kanji_dist, metrics] = await Promise.all([
        fetchJSON(`${dir}/kanji_dist_${key}.json`),
        fetchJSON(`${dir}/metrics_${key}.json`),
      ]);

      if (!kanji_dist || !metrics) {
        console.warn(`${key}: ファイルが見つかりません。スキップします。`);
        continue;
      }

      CORPORA[key] = { label, kanji_dist, metrics };
      console.log(`${key}: 読み込み完了 (${Object.keys(kanji_dist).length} 漢字, ${metrics.length} 語)`);
    } catch (e) {
      console.warn(`${key}: 読み込みエラー`, e);
    }
  }

  // 最初に読み込めたコーパスを選択
  const keys = Object.keys(CORPORA);
  if (keys.length > 0) {
    currentCorpus = keys[0];
  }

  // タブを再描画
  initCorpusTabs();
}

// Production: load from JSON files
// async function loadCorpus(name, url_dist, url_metrics) {
//   const [dist, metrics] = await Promise.all([
//     fetch(url_dist).then(r => r.json()),
//     fetch(url_metrics).then(r => r.json()),
//   ]);
//   CORPORA[name] = { label: name, kanji_dist: dist, metrics: metrics };
// }

//let currentCorpus = 'sample';
let currentCorpus = 'nlt';

// ═══════════════════════════════════════════
// Mora segmentation (JS port of kana_to_mora)
// ═══════════════════════════════════════════
const SMALL_KANA = new Set('ゃゅょぁぃぅぇぉャュョァィゥェォ');

function kanaToMora(reading) {
  const morae = [];
  let i = 0;
  while (i < reading.length) {
    const ch = reading[i];
    if (i + 1 < reading.length && SMALL_KANA.has(reading[i+1])) {
      morae.push(ch + reading[i+1]);
      i += 2;
    } else {
      morae.push(ch);
      i += 1;
    }
  }
  return morae;
}

// ═══════════════════════════════════════════
// Levenshtein distance and neighborhood metrics
// ═══════════════════════════════════════════
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length: m + 1}, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = Math.min(
        dp[i-1][j] + 1,
        dp[i][j-1] + 1,
        dp[i-1][j-1] + (a[i-1] !== b[j-1] ? 1 : 0),
      );
    }
  }
  return dp[m][n];
}

function computeNeighborMetrics(query, queryReading, corpus) {
  const metrics = corpus.metrics;
  if (!metrics || !metrics.length) return { ons: null, pns: null, old20: null };

  let ons = 0;
  let pns = 0;
  const orthDists = [];

  for (const m of metrics) {
    const od = levenshtein(query, m.w);
    orthDists.push(od);
    if (od === 1) ons++;
    if (queryReading && m.r) {
      const pd = levenshtein(queryReading, m.r);
      if (pd === 1) pns++;
    }
  }

  // OLD20: mean of 20 smallest orthographic distances (excluding self)
  orthDists.sort((a, b) => a - b);
  const nonzero = orthDists.filter(d => d > 0);
  const top20 = nonzero.slice(0, 20);
  const old20 = top20.length > 0
    ? top20.reduce((a, b) => a + b, 0) / top20.length
    : null;

  return { ons, pns, old20 };
}

// ═══════════════════════════════════════════
// Nonword prediction (JS port of predict_nonword)
// ═══════════════════════════════════════════
function predictNonword(word, kanjiDist, topN = 10) {
  const chars = [...word];
  const perUnit = [];

  for (const ch of chars) {
    const entry = kanjiDist[ch];
    if (!entry || !entry.readings.length) {
      perUnit.push([{ reading: ch, prob: 1.0 }]);
      continue;
    }
    perUnit.push(entry.readings.slice(0, 5).map(([r, p]) => ({reading: r, prob: p})));
  }

  // Cartesian product
  let candidates = [{ parts: [], prob: 1.0 }];
  for (const readings of perUnit) {
    const next = [];
    for (const cand of candidates) {
      for (const r of readings) {
        next.push({
          parts: [...cand.parts, r.reading],
          prob: cand.prob * r.prob,
        });
      }
    }
    candidates = next;
  }

  candidates.sort((a, b) => b.prob - a.prob);
  candidates = candidates.slice(0, topN);

  // Per-char consistency and entropy
  const perCharCons = chars.map(ch => {
    const entry = kanjiDist[ch];
    return entry ? entry.consistency : 0;
  });
  const perCharEnt = chars.map(ch => {
    const entry = kanjiDist[ch];
    if (!entry || !entry.readings.length) return 0;
    return -entry.readings.reduce((s, [, p]) => s + (p > 0 ? p * Math.log(p) : 0), 0);
  });
  const wordCons = perCharCons.reduce((a,b) => a+b, 0) / perCharCons.length;
  const wordEnt = perCharEnt.reduce((a,b) => a+b, 0) / perCharEnt.length;

  return { chars, candidates, perCharCons, perCharEnt, wordCons, wordEnt, perUnit };
}

// ═══════════════════════════════════════════
// Ad-hoc consistency_target computation
// ═══════════════════════════════════════════

/**
 * カタカナ→ひらがな変換
 */
function katakanaToHiragana(str) {
  return str.replace(/[ァ-ヶ]/g, ch =>
    String.fromCharCode(ch.charCodeAt(0) - 0x60)
  );
}

/**
 * 任意の (語, 読み) に対して consistency_target を計算する。
 * align_word_reading の JS 実装（簡易版：均等分割を試行）。
 *
 * 戻り値: { ct, alignment, perUnit }
 *   ct: consistency_target (平均 P(r_aligned|K))
 *   alignment: "橋→はし" 形式の文字列
 *   perUnit: [{char, reading, prob}]
 */
function computeConsTargetForReading(word, reading, kanjiDist) {
  const chars = [...word];
  const readingHira = katakanaToHiragana(reading);
  const morae = kanaToMora(readingHira);
  const nChars = chars.length;
  const nMorae = morae.length;

  if (nChars === 0 || nMorae === 0) return null;

  // 単一文字 → 全モーラがその文字の読み
  if (nChars === 1) {
    const readingKey = morae.join('');
    const entry = kanjiDist[chars[0]];
    let prob = 0;
    if (entry) {
      const found = entry.readings.find(([r]) => r === readingKey);
      prob = found ? found[1] : 0;
    }
    return {
      ct: prob,
      alignment: `${chars[0]}→${readingKey}`,
      perUnit: [{ char: chars[0], reading: readingKey, prob }],
    };
  }

  // 複数文字 → 全可能分割を試し、最尤分割を選択
  // splits: nChars 個のスロットに nMorae 個のモーラを分配する組み合わせ
  function* generateSplits(nSlots, nItems) {
    if (nSlots === 1) {
      if (nItems >= 1) yield [nItems];
      return;
    }
    for (let take = 1; take <= nItems - (nSlots - 1); take++) {
      for (const rest of generateSplits(nSlots - 1, nItems - take)) {
        yield [take, ...rest];
      }
    }
  }

  let bestProb = -Infinity;
  let bestSplit = null;
  let bestPerUnit = null;

  for (const split of generateSplits(nChars, nMorae)) {
    let logProb = 0;
    const perUnit = [];
    let offset = 0;
    let valid = true;

    for (let i = 0; i < nChars; i++) {
      const readingMorae = morae.slice(offset, offset + split[i]);
      const readingKey = readingMorae.join('');
      offset += split[i];

      const entry = kanjiDist[chars[i]];
      let prob = 0;
      if (entry) {
        const found = entry.readings.find(([r]) => r === readingKey);
        prob = found ? found[1] : 0;
      }

      if (prob <= 0) {
        // このアライメントでは P=0 のスロットがある
        // log(0) を避けるため小さな値を使う
        logProb += Math.log(1e-10);
      } else {
        logProb += Math.log(prob);
      }
      perUnit.push({ char: chars[i], reading: readingKey, prob });
    }

    if (logProb > bestProb) {
      bestProb = logProb;
      bestSplit = split;
      bestPerUnit = perUnit;
    }
  }

  if (!bestPerUnit) return null;

  const validProbs = bestPerUnit.filter(u => u.prob > 0).map(u => u.prob);
  const ct = validProbs.length > 0
    ? validProbs.reduce((a, b) => a + b, 0) / bestPerUnit.length
    : 0;

  const alignment = bestPerUnit.map(u => `${u.char}→${u.reading}`).join(' / ');

  return { ct, alignment, perUnit: bestPerUnit };
}

// ═══════════════════════════════════════════
// UI
// ═══════════════════════════════════════════
function initCorpusTabs() {
  const container = document.getElementById('corpusTabs');
  container.innerHTML = '';
  for (const [key, corpus] of Object.entries(CORPORA)) {
    const btn = document.createElement('button');
    btn.textContent = corpus.label;
    btn.className = key === currentCorpus ? 'active' : '';
    btn.onclick = () => { currentCorpus = key; initCorpusTabs(); doSearch(); };
    container.appendChild(btn);
  }
}

function consColor(c) {
  if (c >= 0.8) return 'cons-high';
  if (c >= 0.5) return 'cons-mid';
  return 'cons-low';
}

function consColorHex(c) {
  if (c >= 0.8) return 'var(--green)';
  if (c >= 0.5) return 'var(--amber)';
  return 'var(--red)';
}

function doSearch() {
  const query = document.getElementById('queryInput').value.trim();
  if (!query) return;

  const corpus = CORPORA[currentCorpus];
  if (!corpus) return;

  const specifiedReading = document.getElementById('readingInput').value.trim();

  // 同一語の全エントリを取得（複数読みが登録されている場合あり）
  const allMatches = corpus.metrics.filter(m => m.w === query);

  const resultsDiv = document.getElementById('results');

  if (allMatches.length > 0) {
    // 読みが指定されている場合、その読みのエントリを優先表示
    let primary;
    if (specifiedReading) {
      const readingHira = katakanaToHiragana(specifiedReading);
      primary = allMatches.find(m => katakanaToHiragana(m.r) === readingHira);
    }
    // 指定読みが見つからない or 未指定 → 頻度最大のエントリを使用
    if (!primary) {
      primary = allMatches.reduce((best, m) => (m.f || 0) > (best.f || 0) ? m : best, allMatches[0]);
    }

    // ONS/PNS/OLD20 計算
    if (primary.ons == null || primary.pns == null || primary.old20 == null) {
      resultsDiv.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>近傍指標を計算中...</p></div>';
      setTimeout(() => {
        const nbr = computeNeighborMetrics(primary.w, primary.r, corpus);
        if (primary.ons == null) primary.ons = nbr.ons;
        if (primary.pns == null) primary.pns = nbr.pns;
        if (primary.old20 == null) primary.old20 = nbr.old20;
        resultsDiv.innerHTML = renderRegistered(primary, corpus, allMatches, specifiedReading);
      }, 10);
    } else {
      resultsDiv.innerHTML = renderRegistered(primary, corpus, allMatches, specifiedReading);
    }
  } else if (specifiedReading) {
    // 未登録語だが読みが指定されている → consistency_target を計算
    const ctResult = computeConsTargetForReading(query, specifiedReading, corpus.kanji_dist);
    const pred = predictNonword(query, corpus.kanji_dist);
    resultsDiv.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>近傍指標を計算中...</p></div>';
    setTimeout(() => {
      const nbr = computeNeighborMetrics(query, specifiedReading, corpus);
      pred.ons = nbr.ons;
      pred.pns = nbr.pns;
      pred.old20 = nbr.old20;
      pred.specifiedReading = specifiedReading;
      pred.ctResult = ctResult;
      resultsDiv.innerHTML = renderNonword(query, pred, corpus);
    }, 10);
  } else {
    const pred = predictNonword(query, corpus.kanji_dist);
    resultsDiv.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>近傍指標を計算中...</p></div>';
    setTimeout(() => {
      const topReading = pred.candidates[0]?.parts.join('') || '';
      const nbr = computeNeighborMetrics(query, topReading, corpus);
      pred.ons = nbr.ons;
      pred.pns = nbr.pns;
      pred.old20 = nbr.old20;
      resultsDiv.innerHTML = renderNonword(query, pred, corpus);
    }, 10);
  }
}

function renderMetricCell(label, value, format = 'number') {
  let display, colorClass = '';
  if (value === null || value === undefined || (typeof value === 'number' && isNaN(value))) {
    display = '—';
  } else if (format === 'number') {
    display = value.toFixed(4);
  } else if (format === 'int') {
    display = value.toString();
  } else {
    display = value;
  }

  let indicator = '';
  if (label.toLowerCase().includes('cons') && typeof value === 'number' && !isNaN(value)) {
    indicator = `<span class="cons-indicator ${consColor(value)}"></span>`;
  }

  return `<div class="metric-cell">
    <div class="label">${label}</div>
    <div class="value">${indicator}${display}</div>
  </div>`;
}

function renderKanjiBreakdown(chars, kanjiDist) {
  return chars.map(ch => {
    const entry = kanjiDist[ch];
    if (!entry) {
      return `<div class="kanji-unit">
        <div class="char">${ch}</div>
        <div class="readings-list" style="color:var(--text-muted)">データなし</div>
      </div>`;
    }
    const maxProb = Math.max(...entry.readings.map(r => r[1]));
    const readingsHtml = entry.readings.slice(0, 6).map(([r, p]) => {
      const barWidth = Math.round(p / maxProb * 100);
      return `<div class="reading-row">
        <span>${r}</span>
        <span style="font-family:var(--mono);font-size:0.75rem">${(p*100).toFixed(1)}%</span>
      </div>
      <div class="reading-bar" style="width:${barWidth}%;background:${consColorHex(p)}"></div>`;
    }).join('');

    return `<div class="kanji-unit">
      <div class="char">${ch} <span style="font-size:0.7rem;color:var(--text-muted)">C=${entry.consistency.toFixed(3)}</span></div>
      <div class="readings-list">${readingsHtml}</div>
    </div>`;
  }).join('');
}

function renderRegistered(m, corpus, allMatches, specifiedReading) {
  const chars = [...m.w];

  // 同一語に複数読みが登録されている場合、一覧を表示
  let multiReadingHtml = '';
  if (allMatches && allMatches.length > 1) {
    const rows = allMatches.map(entry => {
      const isCurrent = entry === m;
      const style = isCurrent ? 'font-weight:700;color:var(--accent)' : 'cursor:pointer;color:var(--text-muted)';
      const marker = isCurrent ? ' ◀' : '';
      return `<span style="${style};margin-right:12px;font-size:0.9rem"
        onclick="document.getElementById('readingInput').value='${entry.r}';doSearch()"
        >${entry.r}（頻度 ${entry.f || 0}, CT ${entry.ct != null ? entry.ct.toFixed(4) : '—'}）${marker}</span>`;
    }).join('');
    multiReadingHtml = `<div style="margin-bottom:12px;padding:10px 12px;background:var(--surface-alt);border-radius:6px;border-left:3px solid var(--amber)">
      <div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:4px">⚠ この語は ${allMatches.length} 件の読みで登録されています（クリックで切替）:</div>
      <div>${rows}</div>
    </div>`;
  }

  // 読み指定による ad-hoc CT 計算結果
  let adHocCtHtml = '';
  if (specifiedReading) {
    const ctResult = computeConsTargetForReading(m.w, specifiedReading, corpus.kanji_dist);
    if (ctResult) {
      adHocCtHtml = `<div style="margin-bottom:16px;padding:12px;background:var(--accent-light);border-radius:6px">
        <div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:6px">指定読み「${specifiedReading}」の Cons. Target:</div>
        <div style="font-family:var(--mono);font-size:1.3rem;font-weight:600;margin-bottom:4px">
          <span class="cons-indicator ${consColor(ctResult.ct)}"></span>${ctResult.ct.toFixed(4)}
        </div>
        <div style="font-family:var(--mono);font-size:0.85rem;color:var(--text-muted)">${ctResult.alignment}</div>
        <div style="font-size:0.75rem;color:var(--text-muted);margin-top:6px">
          ${ctResult.perUnit.map(u => `P(${u.reading}|${u.char})=${u.prob.toFixed(4)}`).join('　')}
        </div>
      </div>`;
    }
  }

  return `<div class="result-card">
    <h2>${m.w} <span class="badge badge-word">登録語</span></h2>
    <div class="reading">${m.r}　（${m.nm} モーラ）</div>

    ${multiReadingHtml}
    ${adHocCtHtml}

    <div class="metrics-grid">
      ${renderMetricCell('Consistency', m.c)}
      ${renderMetricCell('Cons. Target', m.ct)}
      ${renderMetricCell('Entropy', m.e)}
      ${renderMetricCell('頻度', m.f, 'int')}
      ${renderMetricCell('ONS', m.ons, 'int')}
      ${renderMetricCell('PNS', m.pns, 'int')}
      ${renderMetricCell('OLD20', m.old20)}
    </div>

    ${m.a ? `<div class="alignment-section">
      <h3>Alignment</h3>
      <div style="font-family:var(--mono);font-size:0.95rem;padding:8px 12px;background:var(--surface-alt);border-radius:4px">${m.a}</div>
    </div>` : ''}

    <div class="alignment-section">
      <h3>漢字別読み分布（P(r|K)）</h3>
      <div class="kanji-breakdown">${renderKanjiBreakdown(chars, corpus.kanji_dist)}</div>
    </div>
  </div>`;
}

function renderNonword(query, pred, corpus) {
  const candidatesRows = pred.candidates.slice(0, 10).map((c, i) => {
    const parts = c.parts.join(' + ');
    return `<tr>
      <td>${i + 1}</td>
      <td>${c.parts.join('')}</td>
      <td style="color:var(--text-muted)">${parts}</td>
      <td>${c.prob.toFixed(6)}</td>
    </tr>`;
  }).join('');

  // 読み指定がある場合、その Cons. Target を表示
  let adHocCtHtml = '';
  if (pred.specifiedReading && pred.ctResult) {
    const ct = pred.ctResult;
    adHocCtHtml = `<div style="margin-bottom:16px;padding:12px;background:var(--accent-light);border-radius:6px">
      <div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:6px">指定読み「${pred.specifiedReading}」の Cons. Target:</div>
      <div style="font-family:var(--mono);font-size:1.3rem;font-weight:600;margin-bottom:4px">
        <span class="cons-indicator ${consColor(ct.ct)}"></span>${ct.ct.toFixed(4)}
      </div>
      <div style="font-family:var(--mono);font-size:0.85rem;color:var(--text-muted)">${ct.alignment}</div>
      <div style="font-size:0.75rem;color:var(--text-muted);margin-top:6px">
        ${ct.perUnit.map(u => `P(${u.reading}|${u.char})=${u.prob.toFixed(4)}`).join('　')}
      </div>
    </div>`;
  }

  return `<div class="result-card">
    <h2>${query} <span class="badge badge-nonword">非単語 / 未登録</span></h2>
    <div class="reading">予測読み: ${pred.candidates[0]?.parts.join('') || '—'}</div>

    ${adHocCtHtml}

    <div class="metrics-grid">
      ${renderMetricCell('Consistency', pred.wordCons)}
      ${renderMetricCell('Entropy', pred.wordEnt)}
      ${renderMetricCell('文字数', pred.chars.length, 'int')}
      ${renderMetricCell('ONS', pred.ons, 'int')}
      ${renderMetricCell('PNS', pred.pns, 'int')}
      ${renderMetricCell('OLD20', pred.old20)}
    </div>

    <div class="alignment-section">
      <h3>漢字別読み分布（P(r|K)）</h3>
      <div class="kanji-breakdown">${renderKanjiBreakdown(pred.chars, corpus.kanji_dist)}</div>
    </div>

    <div class="candidates-section">
      <h3>読み候補（上位${Math.min(10, pred.candidates.length)}）</h3>
      <table class="candidates-table">
        <thead><tr><th>#</th><th>読み</th><th>分解</th><th>結合確率</th></tr></thead>
        <tbody>${candidatesRows}</tbody>
      </table>
    </div>
  </div>`;
}
